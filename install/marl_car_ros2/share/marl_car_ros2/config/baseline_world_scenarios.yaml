scenarios:
  narrow_corridor:
    tag: baseline_narrow_corridor
    world_file: worlds/baseline_narrow_corridor.world
    spawn:
      x: 0.0
      y: 0.0
      z: 0.1
      yaw: 0.0
    goal:
      x: 8.0
      y: 0.0
    notes: "Corridor width ~0.55m with local offset narrowing."

  sharp_turns:
    tag: baseline_sharp_turns
    world_file: worlds/baseline_sharp_turns.world
    spawn:
      x: 0.0
      y: 0.0
      z: 0.1
      yaw: 0.0
    goal:
      x: 3.8
      y: 0.2
    notes: "Includes one L-turn and one hairpin-like U-turn return section."

  dynamic_crossing:
    tag: baseline_dynamic_crossing
    world_file: worlds/baseline_dynamic_crossing.world
    spawn:
      x: 0.0
      y: 0.0
      z: 0.1
      yaw: 0.0
    goal:
      x: 8.0
      y: 0.0
    dynamic_obstacle:
      enable: true
      mode: crossing_deterministic
      cmd_topic: /model/dynamic_crossing_box/cmd_vel
      speed_mps: 0.45
      trigger_mode: time_after_start
      trigger_time_s: 4.0
      trigger_robot_x: 2.0
      crossing_span_m: 1.6
      initial_direction: 1.0
      repeat: true
    notes: "Single deterministic moving box crosses the robot path using TrajectoryFollower."
